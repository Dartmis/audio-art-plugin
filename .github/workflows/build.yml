name: Build Audio ART (VST3 + Standalone)

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release -j4
      - name: Collect artifacts
        run: |
          echo "---- Full artefacts tree ----"
          find build/AudioART_artefacts -maxdepth 5
          mkdir -p dist
          cp -R build/AudioART_artefacts/Release/. dist/
          echo "---- dist contents ----"
          find dist -maxdepth 3
      - uses: actions/upload-artifact@v4
        with:
          name: AudioART-macOS
          path: dist

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release -j4
      - name: Collect artifacts
        shell: bash
        run: |
          echo "---- Full artefacts tree ----"
          find build/AudioART_artefacts -maxdepth 5
          mkdir -p dist
          cp -R build/AudioART_artefacts/Release/. dist/
          echo "---- dist contents ----"
          find dist -maxdepth 3
      - uses: actions/upload-artifact@v4
        with:
          name: AudioART-Windows
          path: dist
